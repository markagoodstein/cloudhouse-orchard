<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CloudHouse Orchard</title>
<meta name="description" content="Field guide for the CloudHouse orchard: tree care, weekly tasks, chill hours and station weather.">
<meta name="theme-color" content="#2f5d34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orchard">

<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: field notebook — one column of plain cards over a pale sage ground, bottom tab bar like a native iPhone app. */
:root{
  --bg:#eef1ea; --surface:#ffffff; --sunk:#e4e9df; --ink:#1c271d; --muted:#5a6857; --line:#d3dacc;
  --accent:#2f5d34; --accent-ink:#ffffff; --accent-soft:#dbe8d8; --bark:#7a4e2d;
  --good:#2f7a3c; --warn:#a86a00; --bad:#b23a2a; --info:#2f5f8f;
  --t-fert:#2f7a3c; --t-prune:#7a4e2d; --t-harv:#b23a2a; --t-bag:#8a6a12; --t-spray:#2f5f8f; --t-slurry:#6e5634;
  --t-water:#1f7591; --t-protect:#6a4a8a; --t-graft:#4f7a22; --t-look:#5a6857;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --r:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101410; --surface:#1a201a; --sunk:#141a14; --ink:#e4eae1; --muted:#9aa896; --line:#2c352b;
    --accent:#86c58f; --accent-ink:#0f1a10; --accent-soft:#223524; --bark:#c99a74;
    --good:#7fcf8b; --warn:#e3b35a; --bad:#f08a78; --info:#8cb8e6;
    --t-fert:#7fcf8b; --t-prune:#d0a27c; --t-harv:#f08a78; --t-bag:#dcc06a; --t-spray:#8cb8e6; --t-slurry:#c9ae86;
    --t-water:#72c4dd; --t-protect:#c3a5e6; --t-graft:#a9d67c; --t-look:#9aa896;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101410; --surface:#1a201a; --sunk:#141a14; --ink:#e4eae1; --muted:#9aa896; --line:#2c352b;
  --accent:#86c58f; --accent-ink:#0f1a10; --accent-soft:#223524; --bark:#c99a74;
  --good:#7fcf8b; --warn:#e3b35a; --bad:#f08a78; --info:#8cb8e6;
  --t-fert:#7fcf8b; --t-prune:#d0a27c; --t-harv:#f08a78; --t-bag:#dcc06a; --t-spray:#8cb8e6; --t-slurry:#c9ae86;
  --t-water:#72c4dd; --t-protect:#c3a5e6; --t-graft:#a9d67c; --t-look:#9aa896;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 10px}
h1{font:600 28px/1.1 var(--font-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 19px/1.2 var(--font-display);margin:0 0 8px;text-wrap:balance}
h3{font-size:13px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--info)} .pill.mute{color:var(--muted)}
.tag{display:inline-block;margin-right:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--c,var(--muted))}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.iconbtn{border:none;background:none;min-width:40px;min-height:40px;border-radius:10px;font-size:20px;line-height:1}
.iconbtn:active,.btn:active{opacity:.7}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.small{font-size:13px}
/* tasks */
.week-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.week-head .lbl{text-align:center;flex:1;min-width:0}
ul.tasks{list-style:none;margin:0;padding:0}
ul.tasks li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
ul.tasks li:first-child{border-top:none}
ul.tasks input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
ul.tasks label{flex:1;min-width:0}
ul.tasks li.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.progress{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:6px}
/* events */
.ev{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:none}
.ev .d{font-weight:600;font-variant-numeric:tabular-nums}
.ev .d small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ev button{all:unset;cursor:pointer;min-width:0;padding:2px 0}
.ev summary{cursor:pointer;padding:2px 0}
.ev details[open] summary{margin-bottom:2px}
.ev button:focus-visible{outline:3px solid var(--info)}
/* trees */
.search{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:44px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tlist li+li{border-top:1px solid var(--line)}
.tlist button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:11px 14px;cursor:pointer}
.tlist button:focus-visible{outline:3px solid var(--info);outline-offset:-3px}
.tlist .nm{font-weight:600;min-width:0}
.tlist .mp{grid-column:1;color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist .rt{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
/* detail */
.kv{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:8px 12px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;min-width:0}
.datepills{display:flex;flex-wrap:wrap;gap:6px}
.datepill{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;font-variant-numeric:tabular-nums;background:var(--sunk)}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.calc label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.calc input,.calc select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
.result{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.result b{font-size:20px;font-variant-numeric:tabular-nums}
.links{display:flex;flex-direction:column;gap:8px}
.links a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface)}
.links a span:last-child{color:var(--muted)}
/* weather */
.now{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
.now .t{font:600 52px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.fc div{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--sunk);font-size:13px}
.fc .hl{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.fc .frost{border-color:var(--bad)}
.meter{position:relative;height:14px;background:var(--sunk);border-radius:8px;margin:28px 0 30px}
.meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--info);border-radius:8px}
.meter .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--muted)}
.meter .mk span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.meter .mk.up span{top:-20px}
/* map */
.mapbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none;height:min(62vh,560px)}
.mapbox svg{width:100%;height:100%;display:block}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-top:10px}
/* tables */
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
td.wrap{white-space:normal;min-width:160px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);text-decoration:none;min-height:48px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{display:inline-flex;align-items:center;gap:4px;border:none;background:none;color:var(--accent);font-size:16px;padding:8px 0;min-height:40px}
.offline{font-size:12px;color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:no-preference){.tlist button,.chip,.btn{transition:background-color .15s}}
@media (min-width:640px){.calc{grid-template-columns:repeat(3,minmax(0,160px))}}
</style>
</head>

nt or disease spray · SLURRY manure slurry (1 bucket = 1 gal dried manure + 4 gal water, poured at the drip line, then mulched) · WATER irrigation · PROTECT frost, heat, wind · Look up: a reminder to research before acting."},{"kind":"p","text":"Fertilizer amounts: two steps. First, slurry in each plant's window (SLURRY tasks below). Then, on each FERT date, the store-bought pounds per application from the Slurry + Supplement sheet. Apply just before a forecast rain from Nov–Apr; water in from May–Sep. No N on deciduous trees after Jul 15 or on citrus after Aug 15."},{"kind":"p","text":"Bagging plan:"},{"kind":"list","items":["Supplies to have by Apr 1: 6×8 in. and 8×10 in. drawstring organza bags (stone fruit, figs, persimmons, pomegranates), 2-layer Japanese paper fruit bags (pears), bird netting or 1-row net sleeves (cherries, mulberries, berries), twist ties, a step ladder.","Pears: bag single fruits at about 1 in. after thinning (mid-May). Keeps out codling moth and birds.","Stone fruit: bag the best 1–3 branches or individual fruits about 3 weeks before first pick. Pluots and plums: bag clusters.","Cherries and mulberries: net or sleeve the whole tree or branch 2–3 weeks before first pick.","Figs: bag individual figs when they start to soften and change color (about 2 weeks before ripe).","Persimmons and pomegranates: bag 4 weeks before first pick (birds, squirrels, leaffooted bugs). Pomegranate bags also catch split fruit.","Citrus, avocados, olives, nuts: no bags. Use trunk guards on avocados and citrus if rats or squirrels climb.","Remove bags at harvest; wash and dry organza bags for reuse."]},{"kind":"p","text":"Site reminders (from the WS-5000 station): frost nights are calm, ~5 per winter, lows 28–31°F; summer peaks 100–112°F; ~45 in. rain, 90% Nov–Apr; storm gusts 35–49 mph a few days each winter."},{"kind":"p","text":"Manure rules: tea and slurry go on the ground only; never on avocados, the makrut lime or capers. No manure within 90 days of picking tree fruit, or 120 days for garlic, onions, berries, asparagus and anything gathered off the ground. Look up: bean test for herbicide carryover before manure goes into beds."}]};

<script>
"use strict";
/* ---------- storage ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem("cho:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("cho:"+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem("cho:"+k)}catch(e){}}
};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const app=$("#app");
const TREES=DATA.trees;
const AVAIL_N=DATA.availN;

/* ---------- dates ---------- */
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function md(d){return MON[d.getMonth()]+" "+d.getDate()}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysBetween(a,b){return Math.round((b-a)/864e5)}
/* recurring: the next time this month/day comes round, on or after `from` */
function nextOcc(isoStr,from=today()){const p=parseISO(isoStr);let d=new Date(from.getFullYear(),p.getMonth(),p.getDate());if(d<from)d=new Date(from.getFullYear()+1,p.getMonth(),p.getDate());return d}
function rel(d){const n=daysBetween(today(),d);if(n===0)return"today";if(n===1)return"tomorrow";if(n<0)return(-n)+" days ago";if(n<14)return"in "+n+" days";return"in "+Math.round(n/7)+" weeks"}

/* ---------- categories & tags ---------- */
const CAT_COLOR={"Stone fruit":"#c2543a","Cherries":"#9b1e3c","Apples, pears & quince":"#b08a1e","Citrus":"#e08a12","Avocados":"#4f7a22","Olives":"#6b7a3a","Figs":"#7a3f6b","Nuts":"#7a4e2d","Subtropical":"#c0457a","Berries":"#5b3f9a","Vegetables & herbs":"#2f7f6a","Ornamental":"#8a6fb8"};
const CATS=Object.keys(CAT_COLOR).filter(c=>TREES.some(t=>t.cat===c));
const TAGS={FERT:"--t-fert",PRUNE:"--t-prune",HARV:"--t-harv",BAG:"--t-bag",SPRAY:"--t-spray",SLURRY:"--t-slurry",WATER:"--t-water",PROTECT:"--t-protect",GRAFT:"--t-graft"};
function splitTag(s){const m=s.match(/^([A-Z]{3,8})\s+(.*)$/);if(m&&TAGS[m[1]])return{tag:m[1],text:m[2]};if(/^Look up:/i.test(s))return{tag:"LOOK UP",text:s.replace(/^Look up:\s*/i,"")};return{tag:"",text:s}}
function tagHTML(tag){if(!tag)return"";const v=TAGS[tag]||"--t-look";return`<span class="tag" style="--c:var(${v})">${esc(tag)}</span>`}
function fitClass(f){f=String(f||"");if(/short|marginal/i.test(f))return"bad";if(/borderline|choose|tight/i.test(f))return"warn";if(/good|over/i.test(f))return"good";return"mute"}
function fitLabel(t){if(t.type.includes("Citrus")||t.cat==="Avocados")return"No chill needed";return t.fit||"—"}

/* ---------- tree events (recurring each year) ---------- */
function treeEvents(t){
  const ev=[];
  t.fert.forEach((d,i)=>ev.push({iso:d,tag:"FERT",text:`Fertilize #${i+1}`,t}));
  if(t.lastN)ev.push({iso:t.lastN,tag:"FERT",text:"Last nitrogen – stop feeding after today",t});
  if(t.harvest)ev.push({iso:t.harvest,tag:"HARV",text:"Earliest likely harvest",t});
  if(t.slurry.open&&t.slurry.buckets>0){ev.push({iso:t.slurry.open,tag:"SLURRY",text:`Slurry window opens (${t.slurry.buckets} bucket${t.slurry.buckets>1?"s":""} per plant)`,t});ev.push({iso:t.slurry.by,tag:"SLURRY",text:"Last day for slurry",t})}
  return ev;
}
const ALL_EVENTS=TREES.flatMap(treeEvents);
function upcoming(days){const t0=today(),out=[];for(const e of ALL_EVENTS){const d=nextOcc(e.iso,t0);if(daysBetween(t0,d)<=days)out.push({...e,date:d})}return out.sort((a,b)=>a.date-b.date||a.tag.localeCompare(b.tag))}
function nextEventFor(t){const t0=today();let best=null;for(const e of treeEvents(t)){const d=nextOcc(e.iso,t0);if(!best||d<best.date)best={...e,date:d}}return best}

/* ---------- weekly task list ---------- */
const WEEKS=TASKS.weeks.map(w=>({...w,s:parseISO(w.start)}));
const SEASON0=WEEKS[0].s; // Oct 12, 2026
function seasonOffsetYears(d){let y=0;while(daysBetween(new Date(SEASON0.getFullYear()+y,SEASON0.getMonth(),SEASON0.getDate()),d)>=364)y++;return y}
function weekIndexFor(d){const y=seasonOffsetYears(d);const shifted=new Date(d.getFullYear()-y,d.getMonth(),d.getDate());let idx=0;for(let i=0;i<WEEKS.length;i++)if(WEEKS[i].s<=shifted)idx=i;return{idx,y}}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)}
function taskKey(y,w,text){return`t${2026+y}:${hash(w.label+"|"+text)}`}
let weekView=null;

/* ---------- routing ---------- */
function route(){
  const h=(location.hash||"#today").slice(1);
  let tab=h.startsWith("tree-")?"trees":h;
  if(!["today","trees","weather","map","more"].includes(tab)&&!h.startsWith("tree-")){tab="today"}
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(h.startsWith("tree-"))return renderTree(Number(h.slice(5)));
  ({today:renderToday,trees:renderTrees,weather:renderWeather,map:renderMap,more:renderMore})[tab]();
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});

/* ---------- TODAY ---------- */
function renderToday(){
  const t0=today();
  const {idx,y}=weekIndexFor(t0);
  if(weekView==null)weekView={idx,y};
  const w=WEEKS[weekView.idx];
  const tasks=w.tasks.map(s=>({raw:s,...splitTag(s),key:taskKey(weekView.y,w,s)}));
  const done=tasks.filter(x=>store.get(x.key,false)).length;
  const isNow=weekView.idx===idx&&weekView.y===y;

    const base=e.text.replace(/\s*\(.*\)$/,"");let it=g.items.find(x=>x.tag===e.tag&&x.base===base);if(!it)g.items.push(it={tag:e.tag,base,list:[]});it.list.push(e)}
  const wx=store.get("wx:last",null);
  const ch=chillSummary();
  app.innerHTML=`
  <header class="top"><div><div class="sub">${DOW[t0.getDay()]}, ${md(t0)} ${t0.getFullYear()}</div><h1>CloudHouse Orchard</h1></div></header>
  <div class="row" style="margin-bottom:12px">
    ${wx&&wx.temp!=null?`<a class="pill info" href="#weather">${Math.round(wx.temp)}°F at ${esc(wx.station)}</a>`:`<a class="pill mute" href="#weather">Weather</a>`}
    ${frostPill()}
    ${ch?`<a class="pill info" href="#weather">${ch.total} chill hr since Nov 1</a>`:""}
  </div>
  <section class="card" aria-labelledby="wk">
    <div class="week-head">
      <button class="iconbtn" id="wprev" aria-label="Previous week">‹</button>
      <div class="lbl"><h2 id="wk" style="margin:0">${isNow?"This week":"Week of"} · ${esc(w.label)}</h2><div class="sub">${done} of ${tasks.length} done${isNow?"":` · <a href="#today" id="wnow">back to this week</a>`}</div></div>
      <button class="iconbtn" id="wnext" aria-label="Next week">›</button>
    </div>
    <div class="progress" aria-hidden="true"><i style="width:${tasks.length?Math.round(100*done/tasks.length):0}%"></i></div>
    <ul class="tasks" style="margin-top:6px">${tasks.map((x,i)=>`<li class="${store.get(x.key,false)?"done":""}"><input type="checkbox" id="tk${i}" data-k="${x.key}" ${store.get(x.key,false)?"checked":""}><label for="tk${i}">${tagHTML(x.tag)} ${esc(x.text)}</label></li>`).join("")}</ul>
  </section>
  <section class="card" aria-labelledby="up">
    <h2 id="up">Coming up · next 14 days</h2>
    ${groups.length?groups.map(g=>`<div class="ev"><div class="d">${md(g.date)}<small>${rel(g.date)}</small></div><div class="stack" style="gap:6px">${g.items.map(it=>it.list.length===1?`<div><button data-tree="${it.list[0].t.id}">${tagHTML(it.tag)}<b>${esc(it.list[0].t.crop)}</b> <span class="muted">${esc(it.list[0].text)}</span></button></div>`:`<details><summary>${tagHTML(it.tag)}<b>${esc(it.base)}</b> <span class="muted">· ${it.list.length} entries</span></summary><div class="small" style="padding:6px 0 0">${it.list.map(e=>`<div><button data-tree="${e.t.id}">${esc(e.t.crop)}${e.t.qty>1?` ×${e.t.qty}`:""}${/\(/.test(e.text)?` <span class="muted">${esc(e.text.match(/\((.*)\)/)[1])}</span>`:""}</button></div>`).join("")}</div></details>`).join("")}</div></div>`).join(""):`<p class="empty">Nothing tree-specific in the next two weeks.</p>`}
  </section>`;
  $("#wprev").onclick=()=>{if(weekView.idx>0)weekView.idx--;else{weekView.idx=WEEKS.length-1;weekView.y--}renderToday()};
  $("#wnext").onclick=()=>{if(weekView.idx<WEEKS.length-1)weekView.idx++;else{weekView.idx=0;weekView.y++}renderToday()};
  const wn=$("#wnow");if(wn)wn.onclick=e=>{e.preventDefault();weekView=null;renderToday()};
  app.querySelectorAll("ul.tasks input").forEach(cb=>cb.onchange=()=>{if(cb.checked)store.set(cb.dataset.k,true);else store.del(cb.dataset.k);cb.closest("li").classList.toggle("done",cb.checked);const n=app.querySelectorAll("ul.tasks input:checked").length;app.querySelector(".week-head .sub").firstChild.textContent=`${n} of ${tasks.length} done`;app.querySelector(".progress i").style.width=Math.round(100*n/tasks.length)+"%"});
  app.querySelectorAll("[data-tree]").forEach(b=>b.onclick=()=>location.hash="tree-"+b.dataset.tree);
}

function stageN(t,stage){if(!t.n)return null;const[a,b,c]=t.n;return{"Yr 1":a,"Yr 2":(a+b)/2,"Yr 3":b,"Mature":c}[stage]}

    ${t.n?`<h3 style="margin-top:14px">Store-bought top-up</h3>

      <label for="st">Tree age<select id="st">${["Yr 1","Yr 2","Yr 3","Mature"].map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select></label>

    };
    ["st","bk","pc"].forEach(i=>$("#"+i).addEventListener("input",calc));calc();

/* ---------- WEATHER ---------- */
const WU="https://api.weather.com";
function settings(){return store.get("settings",{key:"",primary:"",fallback:""})}
async function getJSON(url){const r=await fetch(url,{cache:"no-store"});if(r.status===204)return null;if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function fetchCurrent(){
  const s=settings();
  for(const id of [s.primary,s.fallback]){
    if(!id)continue;
    const j=await getJSON(`${WU}/v2/pws/observations/current?stationId=${encodeURIComponent(id)}&format=json&units=e&numericPrecision=decimal&apiKey=${encodeURIComponent(s.key)}`);
    const o=j&&j.observations&&j.observations[0];
    if(o&&Date.now()/1000-o.epoch<3*3600){
      const w={station:id,time:o.epoch*1000,temp:o.imperial.temp,hum:o.humidity,wind:o.imperial.windSpeed,gust:o.imperial.windGust,dir:o.winddir,rain:o.imperial.precipTotal,rate:o.imperial.precipRate,dew:o.imperial.dewpt,geo:[+o.lat.toFixed(3),+o.lon.toFixed(3)]};
      store.set("wx:last",w);store.set("wx:geo",w.geo);return w;
    }
  }
  throw new Error("Neither station has reported in the last 3 hours.");
}
async function fetchForecast(){
  const s=settings(),g=store.get("wx:geo",null);if(!g)return null;
  const j=await getJSON(`${WU}/v3/wx/forecast/daily/5day?geocode=${g[0]},${g[1]}&format=json&units=e&language=en-US&apiKey=${encodeURIComponent(s.key)}`);
  if(!j)return null;
  const days=j.dayOfWeek.map((d,i)=>({d,date:j.validTimeLocal?j.validTimeLocal[i].slice(0,10):null,hi:j.calendarDayTemperatureMax[i],lo:j.calendarDayTemperatureMin[i],qpf:j.qpf[i],txt:j.narrative[i]}));
  const f={time:Date.now(),days};store.set("wx:fc",f);return f;
}
/* chill hours: Nov 1 – Feb 28, hours with average temp 32–45°F */
function seasonStart(d=today()){const y=d.getMonth()>=10?d.getFullYear():d.getFullYear()-1;return new Date(y,10,1)}
function seasonEnd(s){return new Date(s.getFullYear()+1,2,1)}
function hourlyToDays(obs,acc){
  for(const o of obs||[]){const day=o.obsTimeLocal.slice(0,10),hr=o.obsTimeLocal.slice(11,13),t=o.imperial&&o.imperial.tempAvg;if(t==null)continue;(acc[day]=acc[day]||{})[hr]=t}
  return acc;
}
function summarizeDay(hrs){const v=Object.values(hrs);return{n:v.length,c:v.filter(t=>t>=32&&t<45).length,lo:Math.min(...v),hi:Math.max(...v)}}
async function updateChill(onProgress){
  const s=settings(),start=seasonStart(),end=seasonEnd(start),t0=today();
  const key="chill:"+start.getFullYear();
  const cache=store.get(key,{days:{}});
  const stop=t0<end?t0:end;
  // recent 7 days from both stations, one call each
  const recent={};
  for(const id of [s.primary,s.fallback]){if(!id)continue;try{const j=await getJSON(`${WU}/v2/pws/observations/hourly/7day?stationId=${encodeURIComponent(id)}&format=json&units=e&numericPrecision=decimal&apiKey=${encodeURIComponent(s.key)}`);recent[id]=hourlyToDays(j&&j.observations,{})}catch(e){recent[id]={}}}
  const pick=(day,src)=>{for(const id of [s.primary,s.fallback]){const h=src[id]&&src[id][day];if(h&&Object.keys(h).length>=18)return{id,h}}return null};
  const missing=[];
  for(let d=new Date(start);d<stop;d.setDate(d.getDate()+1)){const k=iso(d);if(cache.days[k])continue;const p=pick(k,recent);if(p){cache.days[k]={...summarizeDay(p.h),st:p.id}}else missing.push(k)}
  // older days: one history call per station per day, cached forever
  let done=0;
  for(const k of missing){
    const ymd=k.replace(/-/g,"");const src={};
    for(const id of [s.primary,s.fallback]){if(!id)continue;try{const j=await getJSON(`${WU}/v2/pws/history/hourly?stationId=${encodeURIComponent(id)}&format=json&units=e&numericPrecision=decimal&date=${ymd}&apiKey=${encodeURIComponent(s.key)}`);src[id]=hourlyToDays(j&&j.observations,{});if(src[id][k]&&Object.keys(src[id][k]).length>=18)break}catch(e){}}
    const p=pick(k,src);cache.days[k]=p?{...summarizeDay(p.h),st:p.id}:{n:0,c:0,st:null};
    done++;if(onProgress)onProgress(done,missing.length);
    store.set(key,cache);await new Promise(r=>setTimeout(r,250));
  }
  // today so far (not cached)
  const tk=iso(t0);const pt=t0<end?pick(tk,recent):null;
  cache.today=pt?{d:tk,...summarizeDay(pt.h),st:pt.id}:null;
  cache.updated=Date.now();store.set(key,cache);return cache;
}
function chillSummary(){
  const start=seasonStart(),c=store.get("chill:"+start.getFullYear(),null);if(!c)return null;
  const days=Object.entries(c.days);let total=0,gaps=0;for(const[,v]of days){total+=v.c;if(v.n<18)gaps++}
  if(c.today&&!c.days[c.today.d])total+=c.today.c;
  return{total,days:days.length,gaps,updated:c.updated,start};
}
function frostPill(){const f=store.get("wx:fc",null);if(!f||Date.now()-f.time>36*3600e3)return"";const lo=Math.min(...f.days.map(d=>d.lo).filter(v=>v!=null));if(lo<=32)return`<a class="pill bad" href="#weather">Frost forecast: low ${lo}°F</a>`;if(lo<=36)return`<a class="pill warn" href="#weather">Frost watch: low ${lo}°F</a>`;return""}
function windDir(d){return d==null?"":["N","NE","E","SE","S","SW","W","NW"][Math.round(d/45)%8]}
function renderWeather(){
  const s=settings(),w=store.get("wx:last",null),f=store.get("wx:fc",null),ch=chillSummary();
  const age=w?Math.round((Date.now()-w.time)/60000):null;
  const marks=[[300,"Hosui, almond"],[600,"Pink Pearl"],[700,"cherries"],[740,"median",1],[800,"Harrow Delight"],[1000,"Calville, Muir"]];
  const max=1300;
  app.innerHTML=`
  <header class="top"><div><div class="sub">${s.primary?`${esc(s.primary)}${s.fallback?` · fallback ${esc(s.fallback)}`:""}`:"No station set"}</div><h1>Weather</h1></div><button class="btn" id="refresh" ${s.key&&s.primary?"":"disabled"}>Refresh</button></header>
  ${!(s.key&&s.primary)?`<section class="card"><h2>Add your key and stations</h2><p class="small" style="margin-top:0">Live readings, the 5-day forecast and this winter's chill count need your Wunderground API key and station IDs. They stay on this phone.</p><a class="btn primary" href="#more" id="tokey" style="display:inline-flex;align-items:center;text-decoration:none">Open settings</a></section>`:""}
  <section class="card" aria-live="polite">
    <h3>Now</h3>
    ${w?`<div class="now"><div class="t">${Math.round(w.temp)}°</div><div class="small"><div><b>${esc(w.station)}</b> · ${age<60?age+" min ago":Math.round(age/60)+" hr ago"}</div><div>Humidity ${Math.round(w.hum)}% · dew point ${Math.round(w.dew)}°</div><div>Wind ${w.wind} mph ${windDir(w.dir)}, gusts ${w.gust}</div><div>Rain today ${w.rain} in${w.rate?` · ${w.rate} in/hr now`:""}</div></div></div>`:`<p class="muted" style="margin:0">No reading saved yet${s.key?". Tap Refresh when you have signal.":"."}</p>`}
    <p class="offline" id="wxmsg"></p>
  </section>
  <section class="card"><h3>Next 5 days</h3>
    ${f?`<div class="fc">${f.days.map(d=>`<div class="${d.lo!=null&&d.lo<=34?"frost":""}"><div><b>${esc(d.d.slice(0,3))}</b></div><div class="hl">${d.hi??"–"}° / ${d.lo??"–"}°</div>${d.lo!=null&&d.lo<=34?`<div style="color:var(--bad);font-weight:600">${d.lo<=32?"Frost":"Frost watch"}</div>`:""}${d.qpf?`<div>${d.qpf} in rain</div>`:""}</div>`).join("")}</div><p class="note">Updated ${md(new Date(f.time))} ${new Date(f.time).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}. Frost nights here are calm and clear; the lowest trees run colder than the station.</p>`:`<p class="muted" style="margin:0">No forecast saved yet.</p>`}
  </section>
  <section class="card"><h3>Chill hours this winter</h3>
    ${ch?`<p style="margin:0"><b class="num" style="font-size:24px">${ch.total}</b> hours between 32 and 45°F since ${md(ch.start)} <span class="muted small">(Nov 1 – Feb 28 count)</span></p>
    <div class="meter" role="img" aria-label="${ch.total} chill hours of a typical 740"><i style="width:${Math.min(100,100*ch.total/max)}%"></i>${marks.map(([v,l,up],i)=>`<div class="mk ${i%2?"up":""}" style="left:${100*v/max}%"><span>${v} ${esc(l)}</span></div>`).join("")}</div>
    <p class="note">${ch.days} days counted${ch.gaps?`, ${ch.gaps} with patchy station data`:""}. Past winters at your station: 2022-23 1,271 · 2023-24 584 · 2024-25 695 · 2025-26 332.</p>`:`<p class="muted" style="margin:0">${s.key?"Tap “Count chill hours” to build this winter's tally from station history (cached on this phone).":"Needs your Wunderground key."}</p>`}
    ${s.key?`<button class="btn" id="chillbtn" style="margin-top:8px">Count chill hours</button>`:""}
  </section>
  <section class="card"><h3>Station pages</h3>
    <div class="links">
      ${[s.primary,s.fallback].filter(Boolean).map((id,i)=>`<a href="https://www.wunderground.com/dashboard/pws/${encodeURIComponent(id)}" target="_blank" rel="noopener"><span>${esc(id)}${i?" (fallback)":" (main)"}</span><span>Wunderground ↗</span></a>`).join("")||`<p class="muted small" style="margin:0">Add your stations in Settings.</p>`}
      ${store.get("wx:geo",null)?`<a href="https://forecast.weather.gov/MapClick.php?lat=${store.get("wx:geo")[0]}&lon=${store.get("wx:geo")[1]}" target="_blank" rel="noopener"><span>Frost and freeze warnings</span><span>NWS ↗</span></a>`:""}
    </div>
  </section>`;
  const msg=$("#wxmsg");
  const tk=$("#tokey");if(tk)tk.onclick=()=>{store.set("ui:more","settings")};
  const refresh=async()=>{
    if(!s.key)return;msg.textContent="Updating…";
    try{await fetchCurrent();try{await fetchForecast()}catch(e){}store.set("wx:ok",Date.now());renderWeather()}
    catch(e){msg.textContent=navigator.onLine?("Couldn’t update: "+e.message):"Offline – showing the last saved reading."}
  };
  $("#refresh").onclick=refresh;
  const cb=$("#chillbtn");if(cb)cb.onclick=async()=>{cb.disabled=true;cb.textContent="Counting…";try{await updateChill((a,b)=>cb.textContent=`Counting… ${a}/${b} days`);renderWeather()}catch(e){cb.disabled=false;cb.textContent="Count chill hours";msg.textContent="Couldn’t reach Wunderground: "+e.message}};
  if(s.key&&navigator.onLine&&(!w||Date.now()-w.time>20*60000)&&!refresh.ran){refresh.ran=true;refresh()}
}

/* ---------- MAP ---------- */
let mapSel=null;
function renderMap(){
  const xs=PINS.map(p=>p.x),ys=PINS.map(p=>-p.y);
  const pad=8,minX=Math.min(...xs)-pad,minY=Math.min(...ys)-pad,W=Math.max(...xs)-minX+pad,H=Math.max(...ys)-minY+pad;
  let vb=store.get("ui:vb",null)||[minX,minY,W,H];
  const pinCat=p=>p.ids.length?TREES[p.ids[0]].cat:"Ornamental";
  app.innerHTML=`
  <header class="top"><div><div class="sub">${PINS.length} pins · north is up · tap a dot</div><h1>Map</h1></div></header>
  <div class="mapbox" id="mb">
    <svg id="sv" viewBox="${vb.join(" ")}" role="img" aria-label="Tree layout">
      <g id="grid"></g>
      ${PINS.map((p,i)=>`<circle data-i="${i}" cx="${p.x}" cy="${-p.y}" r="2.6" fill="${CAT_COLOR[pinCat(p)]}" stroke="var(--surface)" stroke-width=".8"/>`).join("")}
      <g id="selg"></g>
    </svg>
    <div class="mapctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Show all" style="font-size:13px">All</button></div>
  </div>
  <section class="card" id="selcard" style="margin-top:12px" ${mapSel==null?"hidden":""}></section>
  <div class="legend">${CATS.map(c=>`<span><span class="dot" style="--c:${CAT_COLOR[c]}"></span>${esc(c)}</span>`).join("")}</div>
  <p class="note">Positions are relative (10 m grid). The real coordinates aren't stored in the app.</p>`;
  const sv=$("#sv");
  const setVB=v=>{vb=v;sv.setAttribute("viewBox",v.join(" "));store.set("ui:vb",v);drawGrid()};
  function drawGrid(){let g="";const s=10;for(let x=Math.ceil(vb[0]/s)*s;x<vb[0]+vb[2];x+=s)g+=`<line x1="${x}" y1="${vb[1]}" x2="${x}" y2="${vb[1]+vb[3]}" stroke="var(--line)" stroke-width="${vb[2]/400}"/>`;for(let y=Math.ceil(vb[1]/s)*s;y<vb[1]+vb[3];y+=s)g+=`<line x1="${vb[0]}" y1="${y}" x2="${vb[0]+vb[2]}" y2="${y}" stroke="var(--line)" stroke-width="${vb[2]/400}"/>`;$("#grid").innerHTML=g}
  drawGrid();
  const zoom=(f,cx,cy)=>{cx??=vb[0]+vb[2]/2;cy??=vb[1]+vb[3]/2;const w=Math.min(W*1.5,Math.max(12,vb[2]*f)),h=w*vb[3]/vb[2];setVB([cx-(cx-vb[0])*w/vb[2],cy-(cy-vb[1])*h/vb[3],w,h])};
  $("#zin").onclick=()=>zoom(.6);$("#zout").onclick=()=>zoom(1/.6);$("#zfit").onclick=()=>setVB([minX,minY,W,H]);
  // pan + pinch
  const pts=new Map();let last=null;
  const toSvg=(e)=>{const r=sv.getBoundingClientRect();const s=Math.max(vb[2]/r.width,vb[3]/r.height);return[vb[0]+(e.clientX-r.left)*s-(r.width*s-vb[2])/2,vb[1]+(e.clientY-r.top)*s-(r.height*s-vb[3])/2,s]};
  sv.addEventListener("pointerdown",e=>{sv.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);last=null});
  sv.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,e);
    if(pts.size===1){const[, ,s]=toSvg(e);setVB([vb[0]-(e.clientX-prev.clientX)*s,vb[1]-(e.clientY-prev.clientY)*s,vb[2],vb[3]]);moved=true}
    else if(pts.size===2){const[a,b]=[...pts.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(last){const c=toSvg({clientX:(a.clientX+b.clientX)/2,clientY:(a.clientY+b.clientY)/2});zoom(last/d,c[0],c[1])}last=d;moved=true}});
  let moved=false;
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)last=null};
  sv.addEventListener("pointerup",e=>{up(e);if(!moved){const c=e.target.closest("circle");if(c){mapSel=+c.dataset.i;showSel()}}moved=false});
  sv.addEventListener("pointercancel",up);
  sv.addEventListener("wheel",e=>{e.preventDefault();const c=toSvg(e);zoom(e.deltaY>0?1.15:1/1.15,c[0],c[1])},{passive:false});
  function showSel(){
    const p=PINS[mapSel],card=$("#selcard");if(!p){card.hidden=true;return}
    $("#selg").innerHTML=`<circle cx="${p.x}" cy="${-p.y}" r="4.6" fill="none" stroke="var(--ink)" stroke-width="1"/>`;
    card.hidden=false;
    card.innerHTML=`<div class="sub">Pin</div><h2>${esc(p.name)}</h2><div class="links">${p.ids.map(id=>{const t=TREES[id];const n=nextEventFor(t);return`<a href="#tree-${id}"><span><span class="dot" style="--c:${CAT_COLOR[t.cat]}"></span>${esc(t.crop)}</span><span>${n?`${esc(n.tag)} ${md(n.date)}`:""} ›</span></a>`}).join("")}</div>`;
  }
  if(mapSel!=null)showSel();
}

/* ---------- MORE: climate, guide, settings ---------- */
function chillChart(){
  const rows=CLIMATE.chill,W=320,H=170,L=34,B=24,T=10,R=8,max=1400;
  const bw=(W-L-R)/rows.length;
  const y=v=>T+(H-T-B)*(1-v/max);
  let g="";for(const v of[0,400,800,1200]){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`}
  rows.forEach((r,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;g+=`<rect x="${x}" y="${y(r.adj)}" width="${w}" height="${y(0)-y(r.adj)}" rx="2" fill="var(--info)"/><text x="${x+w/2}" y="${y(r.adj)-4}" text-anchor="middle" font-size="10" fill="var(--ink)">${r.adj}</text><text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${r.w.slice(2)}</text>`});
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(740)}" y2="${y(740)}" stroke="var(--bad)" stroke-dasharray="4 3"/><text x="${W-R}" y="${y(740)-4}" text-anchor="end" font-size="10" fill="var(--bad)">median 740</text>`;
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Chill hours per winter at the station">${g}</svg>`;
}
function renderMore(){
  const sec=store.get("ui:more","climate"),s=settings();
  app.innerHTML=`
  <header class="top"><div><div class="sub">Station records, guide and settings</div><h1>${{climate:"Climate",guide:"Guide",settings:"Settings"}[sec]}</h1></div></header>
  <div class="chips" role="group" aria-label="Section">${[["climate","Climate"],["guide","Guide"],["settings","Settings"]].map(([k,l])=>`<button class="chip" data-s="${k}" aria-pressed="${k===sec}">${l}</button>`).join("")}</div>
  <div id="more" style="margin-top:8px"></div>`;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{store.set("ui:more",b.dataset.s);renderMore()});
  const m=$("#more");
  if(sec==="climate"){
    const C=CLIMATE;
    m.innerHTML=`
    <section class="card"><h2>Chill hours per winter</h2>${chillChart()}<p class="note">Hours between 32 and 45°F, Nov 1 – Feb 28, from your WS-5000 (gap-adjusted). The older regional estimate ran about 1.5× higher.</p>
      <div class="tbl"><table><thead><tr><th>Winter</th><th>Nov–Feb</th><th>Oct–Mar</th><th>Chill portions</th><th>Regional est.</th></tr></thead><tbody>${C.chill.map(r=>`<tr><td>${r.w}</td><td>${r.adj}</td><td>${r.om}</td><td>${r.dp}</td><td class="muted">${r.grid}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="card"><h2>Month by month</h2><div class="tbl"><table><thead><tr><th>Month</th><th>High</th><th>Low</th><th>Rain in</th><th>Frost nights</th><th>Lowest</th><th>Highest</th><th>Days ≥95°</th></tr></thead><tbody>${C.monthly.map(r=>`<tr><td>${r.m}</td><td>${r.hi}</td><td>${r.lo}</td><td>${r.rain}</td><td>${r.f32}</td><td>${r.min}</td><td>${r.max}</td><td>${r.d95}</td></tr>`).join("")}</tbody></table></div><p class="note">Station averages, Nov 2020 – Sep 2026 (°F).</p></section>
    <section class="card"><h2>Frost and heat by year</h2><div class="tbl"><table><thead><tr><th>Year</th><th>Last spring frost</th><th>First fall frost</th><th>Winter low °F</th><th>Frost nights</th><th>Rain in</th><th>Hottest</th><th>GDD</th></tr></thead><tbody>${C.years.map(r=>`<tr><td>${r.y}</td><td>${r.last32}</td><td>${r.first32}</td><td>${r.low}</td><td>${r.n32}</td><td>${r.rain}</td><td>${r.hot}</td><td>${r.gdd??"—"}</td></tr>`).join("")}</tbody></table></div><p class="note">Rain is per water year (Oct–Sep); * partial year.</p></section>
    <section class="card"><h2>Wind</h2><dl class="kv">${C.wind.map(([a,b,c])=>`<dt>${esc(a)}</dt><dd><b>${esc(b)}</b><div class="small muted">${esc(c)}</div></dd>`).join("")}</dl></section>`;
  } else if(sec==="guide"){
    m.innerHTML=`<section class="card">${TASKS.guide.map(g=>g.kind==="p"?`<p>${esc(g.text)}</p>`:`<ul>${g.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`).join("")}</section>
    <section class="card"><h2>Sources</h2><div class="links">
      <a href="https://homeorchard.ucanr.edu/" target="_blank" rel="noopener"><span>UC California Backyard Orchard</span><span>↗</span></a>
      <a href="https://ipm.ucanr.edu/home-and-landscape/" target="_blank" rel="noopener"><span>UC IPM home & garden pests</span><span>↗</span></a>
      <a href="https://citrusvariety.ucr.edu/" target="_blank" rel="noopener"><span>UC Riverside Citrus Variety Collection</span><span>↗</span></a>
      <a href="https://www.davewilson.com/" target="_blank" rel="noopener"><span>Dave Wilson Nursery</span><span>↗</span></a>
      <a href="https://fruitsandnuts.ucanr.edu/Weather_Services/Chill_Calculators" target="_blank" rel="noopener"><span>UC chill calculators</span><span>↗</span></a>
    </div></section>`;
  } else {
    m.innerHTML=`
    <section class="card"><h2>Wunderground</h2>
      <form id="sf" class="stack">
        <label class="small">API key<input id="key" class="search" type="password" autocomplete="off" value="${esc(s.key)}" placeholder="Paste your key"></label>
        <div class="row"><label class="small" style="flex:1;min-width:140px">Main station<input id="pri" class="search" value="${esc(s.primary)}" placeholder="Station ID" autocapitalize="characters"></label><label class="small" style="flex:1;min-width:140px">Fallback<input id="fb" class="search" value="${esc(s.fallback)}" placeholder="Optional" autocapitalize="characters"></label></div>
        <div class="row"><button class="btn primary" type="submit">Save</button><span id="saved" class="small muted" aria-live="polite"></span></div>
      </form>
      <p class="note">The key and station IDs are kept only on this phone. Find the key at wunderground.com → My Profile → API Keys.</p>
    </section>
    <section class="card"><h2>Backup</h2>
      <p class="small" style="margin-top:0">Checkmarks, tree ages and saved weather live on this phone. Save a backup now and then.</p>
      <div class="row"><button class="btn" id="exp">Save backup file</button><label class="btn" for="imp" style="display:inline-flex;align-items:center">Restore…</label><input id="imp" type="file" accept="application/json" hidden></div>
      <p id="bmsg" class="small muted" aria-live="polite"></p>
    </section>
    <section class="card"><h2>About</h2><p class="small" style="margin:0">Plan data as of Oct 17, 2026 (spreadsheet v8 and weekly task list). App build ${esc(BUILD)}. Works offline once opened from the Home Screen.</p>
      <div class="row" style="margin-top:10px"><button class="btn" id="clr">Clear saved weather</button></div></section>`;
    $("#sf").onsubmit=e=>{e.preventDefault();store.set("settings",{key:$("#key").value.trim(),primary:$("#pri").value.trim().toUpperCase(),fallback:$("#fb").value.trim().toUpperCase()});$("#saved").textContent="Saved."};
    $("#exp").onclick=()=>{const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("cho:")&&k!=="cho:settings")o[k]=localStorage.getItem(k)}}catch(e){}const b=new Blob([JSON.stringify({app:"cloudhouse-orchard",saved:new Date().toISOString(),data:o})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="orchard-backup-"+iso(today())+".json";document.body.appendChild(a);a.click();a.remove();$("#bmsg").textContent="Backup saved (your API key is not included)."};
    $("#imp").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());let n=0;for(const[k,v]of Object.entries(j.data||{}))if(k.startsWith("cho:")){localStorage.setItem(k,v);n++}$("#bmsg").textContent=`Restored ${n} items.`}catch(err){$("#bmsg").textContent="That file isn't an orchard backup."}};
    $("#clr").onclick=()=>{["wx:last","wx:fc","wx:geo"].forEach(k=>store.del(k));try{Object.keys(localStorage).filter(k=>k.startsWith("cho:chill:")).forEach(k=>localStorage.removeItem(k))}catch(e){}$("#clr").textContent="Cleared"};
  }
}

route();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
