<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orchard Management</title>
<meta name="description" content="Field app for an orchard kept in Dropbox: tree care, weekly tasks, chill hours and station weather.">
<meta name="theme-color" content="#2f5d34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>

/* Layout: field notebook — one column of plain cards over a pale sage ground, bottom tab bar like a native iPhone app. */
:root{
  --bg:#eef1ea; --surface:#ffffff; --sunk:#e4e9df; --ink:#1c271d; --muted:#5a6857; --line:#d3dacc;
  --accent:#2f5d34; --accent-ink:#ffffff; --accent-soft:#dbe8d8; --bark:#7a4e2d;
  --good:#2f7a3c; --warn:#a86a00; --bad:#b23a2a; --info:#2f5f8f;
  --t-fert:#2f7a3c; --t-prune:#7a4e2d; --t-harv:#b23a2a; --t-bag:#8a6a12; --t-spray:#2f5f8f; --t-slurry:#6e5634;
  --t-water:#1f7591; --t-protect:#6a4a8a; --t-graft:#4f7a22; --t-look:#5a6857;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --r:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101410; --surface:#1a201a; --sunk:#141a14; --ink:#e4eae1; --muted:#9aa896; --line:#2c352b;
    --accent:#86c58f; --accent-ink:#0f1a10; --accent-soft:#223524; --bark:#c99a74;
    --good:#7fcf8b; --warn:#e3b35a; --bad:#f08a78; --info:#8cb8e6;
    --t-fert:#7fcf8b; --t-prune:#d0a27c; --t-harv:#f08a78; --t-bag:#dcc06a; --t-spray:#8cb8e6; --t-slurry:#c9ae86;
    --t-water:#72c4dd; --t-protect:#c3a5e6; --t-graft:#a9d67c; --t-look:#9aa896;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101410; --surface:#1a201a; --sunk:#141a14; --ink:#e4eae1; --muted:#9aa896; --line:#2c352b;
  --accent:#86c58f; --accent-ink:#0f1a10; --accent-soft:#223524; --bark:#c99a74;
  --good:#7fcf8b; --warn:#e3b35a; --bad:#f08a78; --info:#8cb8e6;
  --t-fert:#7fcf8b; --t-prune:#d0a27c; --t-harv:#f08a78; --t-bag:#dcc06a; --t-spray:#8cb8e6; --t-slurry:#c9ae86;
  --t-water:#72c4dd; --t-protect:#c3a5e6; --t-graft:#a9d67c; --t-look:#9aa896;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 10px}
h1{font:600 28px/1.1 var(--font-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 19px/1.2 var(--font-display);margin:0 0 8px;text-wrap:balance}
h3{font-size:13px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--info)} .pill.mute{color:var(--muted)}
.tag{display:inline-block;margin-right:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--c,var(--muted))}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.iconbtn{border:none;background:none;min-width:40px;min-height:40px;border-radius:10px;font-size:20px;line-height:1}
.iconbtn:active,.btn:active{opacity:.7}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.small{font-size:13px}
/* tasks */
.week-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.week-head .lbl{text-align:center;flex:1;min-width:0}
ul.tasks{list-style:none;margin:0;padding:0}
ul.tasks li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
ul.tasks li:first-child{border-top:none}
ul.tasks input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
ul.tasks label{flex:1;min-width:0}
ul.tasks li.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.progress{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:6px}
/* events */
.ev{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:none}
.ev .d{font-weight:600;font-variant-numeric:tabular-nums}
.ev .d small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ev button{all:unset;cursor:pointer;min-width:0;padding:2px 0}
.ev summary{cursor:pointer;padding:2px 0}
.ev details[open] summary{margin-bottom:2px}
.ev button:focus-visible{outline:3px solid var(--info)}
/* trees */
.search{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:44px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tlist li+li{border-top:1px solid var(--line)}
.tlist button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:11px 14px;cursor:pointer}
.tlist button:focus-visible{outline:3px solid var(--info);outline-offset:-3px}
.tlist .nm{font-weight:600;min-width:0}
.tlist .mp{grid-column:1;color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist .rt{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
/* detail */
.kv{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:8px 12px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;min-width:0}
.datepills{display:flex;flex-wrap:wrap;gap:6px}
.datepill{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;font-variant-numeric:tabular-nums;background:var(--sunk)}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.calc label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.calc input,.calc select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
.result{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.result b{font-size:20px;font-variant-numeric:tabular-nums}
.links{display:flex;flex-direction:column;gap:8px}
.links a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface)}
.links a span:last-child{color:var(--muted)}
/* weather */
.now{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
.now .t{font:600 52px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.fc div{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--sunk);font-size:13px}
.fc .hl{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.fc .frost{border-color:var(--bad)}
.meter{position:relative;height:14px;background:var(--sunk);border-radius:8px;margin:28px 0 30px}
.meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--info);border-radius:8px}
.meter .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--muted)}
.meter .mk span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.meter .mk.up span{top:-20px}
/* map */
.mapbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none;height:min(62vh,560px)}
.mapbox svg{width:100%;height:100%;display:block}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-top:10px}
/* tables */
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
td.wrap{white-space:normal;min-width:160px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);text-decoration:none;min-height:48px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{display:inline-flex;align-items:center;gap:4px;border:none;background:none;color:var(--accent);font-size:16px;padding:8px 0;min-height:40px}
.offline{font-size:12px;color:var(--warn)}
.near{list-style:none;margin:6px 0 0;padding:0}
.near li+li{border-top:1px solid var(--line)}
.near button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;padding:9px 0;cursor:pointer}
.near button:focus-visible{outline:3px solid var(--info)}
.near .dist{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.near .pin{grid-column:1;color:var(--muted);font-size:12.5px}
.near li:first-child .dist{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:no-preference){.tlist button,.chip,.btn{transition:background-color .15s}}
@media (min-width:640px){.calc{grid-template-columns:repeat(3,minmax(0,160px))}}

button.pill{background:none;cursor:pointer;min-height:28px}
textarea.search{font:inherit;line-height:1.4;padding:10px}
select.inline{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:36px}
select.search{width:100%}
.guide h2,.guide h3{margin:14px 0 6px}.guide h2:first-child{margin-top:0}
.guide p,.guide li{font-size:15px}
nav.tabs[hidden]{display:none}
code{font-size:.92em;background:var(--line);padding:0 4px;border-radius:4px}
</style>
</head>

<script>
"use strict";
/* Orchard Management — local-first client for an orchard folder in Dropbox.
   Data format: see README.md in the orchard folder. */
const DBX_KEY = "bop8no9cvweg2hj";
const SCOPES = "account_info.read files.metadata.read files.metadata.write files.content.read files.content.write sharing.read";
const REDIRECT = location.origin + location.pathname.replace(/index\.html$/, "");
const BUILD = "20261111-1345";

/* ---------- small helpers ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("om:" + k); return v == null ? d : JSON.parse(v) } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem("om:" + k, JSON.stringify(v)) } catch (e) { } },
  del(k) { try { localStorage.removeItem("om:" + k) } catch (e) { } }
};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const app = $("#app");
function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d }
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") }
function md(d) { return MON[d.getMonth()] + " " + d.getDate() }
function mdDate(m, y) { const [a, b] = m.split("-").map(Number); return new Date(y, a - 1, b) }
function fmtMD(m) { const [a, b] = m.split("-").map(Number); return MON[a - 1] + " " + b }
function addDaysMD(m, n) { const d = mdDate(m, 2027); d.setDate(d.getDate() + n); return String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") }
function nextOcc(m, from = today()) { let d = mdDate(m, from.getFullYear()); if (d < from) d = mdDate(m, from.getFullYear() + 1); return d }
function daysBetween(a, b) { return Math.round((b - a) / 864e5) }
function rel(d) { const n = daysBetween(today(), d); if (n === 0) return "today"; if (n === 1) return "tomorrow"; if (n < 0) return (-n) + " days ago"; if (n < 14) return "in " + n + " days"; return "in " + Math.round(n / 7) + " weeks" }
function ago(t) { if (!t) return "never"; const m = Math.round((Date.now() - t) / 60000); if (m < 1) return "just now"; if (m < 60) return m + " min ago"; const h = Math.round(m / 60); if (h < 24) return h + " hr ago"; return Math.round(h / 24) + " days ago" }
function b64url(bytes) { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") }
function rid(n = 6) { return b64url(crypto.getRandomValues(new Uint8Array(n))).replace(/[-_]/g, "x").toLowerCase().slice(0, n) }
function isStandalone() { return window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches }

/* ---------- IndexedDB: the device's full local copy ---------- */
let _db = null;
function idbOpen() {
  if (_db) return Promise.resolve(_db);
  return new Promise((ok, no) => {
    const r = indexedDB.open("orchard-management", 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("files", { keyPath: "rel" }); d.createObjectStore("queue", { keyPath: "rel" }) };
    r.onsuccess = () => { _db = r.result; ok(_db) }; r.onerror = () => no(r.error);
  });
}
async function idb(storeName, mode, fn) {
  const d = await idbOpen();
  return new Promise((ok, no) => {
    const t = d.transaction(storeName, mode), s = t.objectStore(storeName); let out;
    const r = fn(s); if (r) r.onsuccess = () => out = r.result;
    t.oncomplete = () => ok(out); t.onerror = () => no(t.error); t.onabort = () => no(t.error);
  });
}
const idbAll = s => idb(s, "readonly", x => x.getAll());
const idbPut = (s, v) => idb(s, "readwrite", x => x.put(v));
const idbDel = (s, k) => idb(s, "readwrite", x => x.delete(k));
const idbClear = s => idb(s, "readwrite", x => x.clear());

const FILES = new Map();   // rel path -> {rel, rev, data}
const QUEUE = new Map();   // rel path -> {rel, data, baseRev}
let PULLED = 0;
async function putFile(rel, rev, data) { const f = { rel, rev, data }; FILES.set(rel, f); await idbPut("files", f) }
async function pullPut(rel, rev, data) { PULLED++; return putFile(rel, rev, data) }
async function pullDrop(rel) { PULLED++; return dropFile(rel) }
async function dropFile(rel) { FILES.delete(rel); await idbDel("files", rel) }

/* ---------- Dropbox ---------- */
class AuthError extends Error { constructor(m) { super(m || "Dropbox sign-in has expired. Reconnect Dropbox.") } }
const apiArg = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
const DBX = {
  tok() { return store.get("dbx:tok", null) },
  async refresh() {
    const t = this.tok(); if (!t) throw new AuthError("Not connected to Dropbox.");
    const r = await fetch("https://api.dropboxapi.com/oauth2/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ grant_type: "refresh_token", refresh_token: t.refresh, client_id: DBX_KEY }) });
    if (r.status === 400 || r.status === 401) { store.del("dbx:tok"); throw new AuthError() }
    if (!r.ok) throw new Error("Dropbox didn't answer (" + r.status + ")");
    const j = await r.json(); const n = { ...t, access: j.access_token, exp: Date.now() + j.expires_in * 1000 }; store.set("dbx:tok", n); return n;
  },
  async token() { let t = this.tok(); if (!t) throw new AuthError("Not connected to Dropbox."); if (Date.now() > t.exp - 60000) t = await this.refresh(); return t.access },
  async call(url, init, retry = 2) {
    init.headers = { ...init.headers, Authorization: "Bearer " + await this.token() };
    const r = await fetch(url, init);

/* ---------- LOCATION: closest tree ---------- */
let geoWatch = null, lastPos = null, geoMsg = "";

function startGeo(onUpdate) {

  stopGeo(); geoMsg = "Finding your location…"; onUpdate();
  geoWatch = navigator.geolocation.watchPosition(p => { lastPos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() }; geoMsg = ""; store.set("geo:on", true); onUpdate() },
    e => { geoMsg = e.code === 1 ? "Location is off for this app. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using." : "Couldn't get your location yet. Step outside or wait a moment."; if (e.code === 1) store.set("geo:on", false); onUpdate() },
    { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 });
}
const DIRS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];

function fmtFt(m) { const ft = m * 3.281; return ft < 1000 ? Math.round(ft) + " ft" : (m / 1609.3).toFixed(1) + " mi" }
function nearest(pos, n = 6) { return PINS.map(p => ({ ...p, ...offset(pos, p) })).sort((a, b) => a.dist - b.dist).slice(0, n) }
function nearbyHTML() {
  if (!PINS.length) return `<section class="card" id="near"><h2>Closest to you</h2><p class="small" style="margin:0">Add tree positions to <code>map.geojson</code> in the orchard folder to get this list.</p></section>`;
  if (!lastPos) return `<section class="card" id="near"><h2>Closest to you</h2>${geoMsg ? `<p class="small muted" style="margin:0 0 8px">${esc(geoMsg)}</p>` : ""}${geoWatch == null ? `<button class="btn primary" id="geostart">Find the closest tree</button>` : ""}</section>`;
  const list = nearest(lastPos);
  if (list[0].dist > 400) return `<section class="card" id="near"><h2>Closest to you</h2><p class="small" style="margin:0">You're ${fmtFt(list[0].dist)} from the nearest tree. The list fills in once you're in the orchard.</p></section>`;
  return `<section class="card" id="near"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Closest to you</h2><span class="small muted num">GPS ±${fmtFt(lastPos.acc)}</span></div>
  <ul class="near">${list.map(p => { const t = p.ids.length === 1 ? TREES[p.ids[0]] : null; const label = t ? t.crop : p.name; const dest = t ? t.pid : (p.ids[0] != null ? TREES[p.ids[0]].pid : null); return `<li><button ${dest != null ? `data-tree="${esc(dest)}"` : "disabled"}><span>${t ? `<span class="dot" style="--c:${color(t.cat)}"></span>` : ""}<b>${esc(label)}</b></span><span class="dist">${fmtFt(p.dist)} ${p.dir}</span><span class="pin">${esc(p.name)}${p.ids.length > 1 ? ` · ${p.ids.length} possible trees` : ""}</span></button></li>` }).join("")}</ul>
  ${lastPos.acc > 15 ? `<p class="note">GPS is rough right now (±${fmtFt(lastPos.acc)}); the order can shuffle until it settles.</p>` : ""}</section>`;
}
function wireNearby(rerender) {
  const n = $("#near"); if (!n) return;
  n.querySelectorAll("[data-tree]").forEach(b => b.onclick = () => location.hash = "tree-" + b.dataset.tree);
  const gs = $("#geostart"); if (gs) gs.onclick = () => startGeo(rerender);
}
function autoGeo(rerender) { if (PINS.length && store.get("geo:on", false) && geoWatch == null) startGeo(rerender) }
function treeLink(t) { return `data-tree="${esc(t.pid)}"` }
function wireTreeLinks(root = app) { root.querySelectorAll("[data-tree]").forEach(b => b.onclick = () => location.hash = "tree-" + b.dataset.tree) }

/* ---------- TODAY ---------- */
let weekView = null;
function taskDone(t, season) { return (t.completions || []).some(c => c.season === season) }
async function toggleTask(task, season, on) {
  const rel = `/tasks/${task.id}.json`, cur = (FILES.get(rel) || {}).data || task;
  const data = JSON.parse(JSON.stringify(cur)); data.completions = (data.completions || []).filter(c => c.season !== season);
  if (on) data.completions.push({ season, by: ME(), at: new Date().toISOString() });
  await saveRecord(rel, data, [{ field: "completions", season, done: on }]);
}
function renderToday() {

  const w = WEEKS[weekView.idx], season = seasonLabel(weekView.y);
  const tasks = w.tasks, done = tasks.filter(x => taskDone(x, season)).length;
  const isNow = weekView.idx === idx0 && weekView.y === y0;
  const wd = dateInSeason(w.start, weekView.y);
  const up = upcoming(14);

    const base = e.text.replace(/\s*\(.*\)$/, ""); let it = g.items.find(x => x.tag === e.tag && x.base === base); if (!it) g.items.push(it = { tag: e.tag, base, list: [] }); it.list.push(e) }

  <div class="row" style="margin-bottom:12px">

  </div>

      <button class="iconbtn" id="wnext" aria-label="Next week">›</button>

    <ul class="tasks" style="margin-top:6px">${tasks.map((x, i) => { const d = taskDone(x, season), c = d && x.completions.find(c => c.season === season); return `<li class="${d ? "done" : ""}"><input type="checkbox" id="tk${i}" data-i="${i}" ${d ? "checked" : ""}><label for="tk${i}">${tagHTML(x.tag)} ${esc(x.text)}${c && c.by !== ME() ? ` <span class="small muted">· ${esc(memberName(c.by))}</span>` : ""}</label></li>` }).join("")}</ul>
  </section>
  <section class="card" aria-labelledby="up">
    <h2 id="up">Coming up · next 14 days</h2>
    ${groups.length ? groups.map(g => `<div class="ev"><div class="d">${md(g.date)}<small>${rel(g.date)}</small></div><div class="stack" style="gap:6px">${g.items.map(it => it.list.length === 1 ? `<div><button ${treeLink(it.list[0].t)}>${tagHTML(it.tag)}<b>${esc(it.list[0].t.crop)}</b> <span class="muted">${esc(it.list[0].text)}</span></button></div>` : `<details><summary>${tagHTML(it.tag)}<b>${esc(it.base)}</b> <span class="muted">· ${it.list.length} entries</span></summary><div class="small" style="padding:6px 0 0">${it.list.map(e => `<div><button ${treeLink(e.t)}>${esc(e.t.crop)}${e.t.qty > 1 ? ` ×${e.t.qty}` : ""}${/\(/.test(e.text) ? ` <span class="muted">${esc(e.text.match(/\((.*)\)/)[1])}</span>` : ""}</button></div>`).join("")}</div></details>`).join("")}</div></div>`).join("") : `<p class="empty">Nothing tree-specific in the next two weeks.</p>`}

  $("#wprev").onclick = () => { if (weekView.idx > 0) weekView.idx--; else { weekView.idx = WEEKS.length - 1; weekView.y-- } renderToday() };

  app.querySelectorAll("ul.tasks input").forEach(cb => cb.onchange = () => {

  });

}

const STAGES = ["Yr 1", "Yr 2", "Yr 3", "Mature"];

}

  const W = 320, H = 170, L = 34, B = 24, T = 10, R = 8, max = 1400, bw = (W - L - R) / rows.length, y = v => T + (H - T - B) * (1 - v / max);
  let g = ""; for (const v of [0, 400, 800, 1200]) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  rows.forEach((r, i) => { const x = L + i * bw + bw * .18, w = bw * .64, v = r.novFebHours; g += `<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0) - y(v)}" rx="2" fill="var(--info)"/><text x="${x + w / 2}" y="${y(v) - 4}" text-anchor="middle" font-size="10" fill="var(--ink)">${v}</text><text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(String(r.winter).slice(2))}</text>` });
  if (med) g += `<line x1="${L}" x2="${W - R}" y1="${y(med)}" y2="${y(med)}" stroke="var(--bad)" stroke-dasharray="4 3"/><text x="${W - R}" y="${y(med) - 4}" text-anchor="end" font-size="10" fill="var(--bad)">median ${med}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Chill hours per winter at the station">${g}</svg>`;
}
function renderMore() {
  const sec = store.get("ui:more", "climate");
  app.innerHTML = header("Station records, guide and settings", { climate: "Climate", guide: "Guide", settings: "Settings" }[sec] || "Climate") + `
  <div class="chips" role="group" aria-label="Section">${[["climate", "Climate"], ["guide", "Guide"], ["settings", "Settings"]].map(([k, l]) => `<button class="chip" data-s="${k}" aria-pressed="${k === sec}">${l}</button>`).join("")}</div>
  <div id="more" style="margin-top:8px"></div>`;
  paintSync();
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { store.set("ui:more", b.dataset.s); renderMore() });
  const m = $("#more"), C = M.site;
  if (sec === "climate") {
    const ch = C.chill || {}, rows = ch.winters || [];
    m.innerHTML = `
    ${rows.length ? `<section class="card"><h2>Chill hours per winter</h2>${chillChart(rows, ch.medianHours)}<p class="note">${esc(ch.definition || "")}${C.station ? ` · ${esc(C.station.model || "")}` : ""}${ch.note ? ". " + esc(ch.note) : ""}</p>
      <div class="tbl"><table><thead><tr><th>Winter</th><th>Nov–Feb</th><th>Oct–Mar</th><th>Chill portions</th><th>Regional est.</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.winter)}</td><td>${r.novFebHours ?? "—"}</td><td>${r.octMarHours ?? "—"}</td><td>${r.dynamicPortions ?? "—"}</td><td class="muted">${r.regionalEstimate ?? "—"}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    ${(C.monthly || []).length ? `<section class="card"><h2>Month by month</h2><div class="tbl"><table><thead><tr><th>Month</th><th>High</th><th>Low</th><th>Rain in</th><th>Frost nights</th><th>Lowest</th><th>Highest</th><th>Days ≥95°</th></tr></thead><tbody>${C.monthly.map(r => `<tr><td>${esc(r.month)}</td><td>${r.avgHighF}</td><td>${r.avgLowF}</td><td>${r.rainIn}</td><td>${r.frostNights}</td><td>${r.lowestF}</td><td>${r.highestF}</td><td>${r.days95F}</td></tr>`).join("")}</tbody></table></div><p class="note">Station averages${C.station && C.station.period ? ", " + esc(C.station.period) : ""} (°F).</p></section>` : ""}
    ${(C.years || []).length ? `<section class="card"><h2>Frost and heat by year</h2><div class="tbl"><table><thead><tr><th>Year</th><th>Last spring frost</th><th>First fall frost</th><th>Winter low °F</th><th>Frost nights</th><th>Rain in</th><th>Hottest</th><th>GDD</th></tr></thead><tbody>${C.years.map(r => `<tr><td>${esc(r.year)}</td><td>${esc(r.lastSpringFrost)}</td><td>${esc(r.firstFallFrost)}</td><td>${esc(r.winterLow)}</td><td>${esc(r.frostNights)}</td><td>${esc(r.rainIn)}</td><td>${esc(r.hottestF)}</td><td>${esc(r.growingDegreeDays ?? "—")}</td></tr>`).join("")}</tbody></table></div><p class="note">Rain is per water year (Oct–Sep); * partial year.</p></section>` : ""}
    ${(C.wind || []).length ? `<section class="card"><h2>Wind</h2><dl class="kv">${C.wind.map(r => `<dt>${esc(r.topic)}</dt><dd><b>${esc(r.value)}</b><div class="small muted">${esc(r.meaning)}</div></dd>`).join("")}</dl></section>` : ""}`;
  } else if (sec === "guide") {
    m.innerHTML = `<section class="card guide">${mdToHTML(M.guide || "No guide.md in the orchard folder.")}</section>
    <section class="card"><h2>Sources</h2><div class="links">
      <a href="https://homeorchard.ucanr.edu/" target="_blank" rel="noopener"><span>UC California Backyard Orchard</span><span>↗</span></a>
      <a href="https://ipm.ucanr.edu/home-and-landscape/" target="_blank" rel="noopener"><span>UC IPM home & garden pests</span><span>↗</span></a>
      <a href="https://citrusvariety.ucr.edu/" target="_blank" rel="noopener"><span>UC Riverside Citrus Variety Collection</span><span>↗</span></a>
      <a href="https://www.davewilson.com/" target="_blank" rel="noopener"><span>Dave Wilson Nursery</span><span>↗</span></a>
      <a href="https://fruitsandnuts.ucanr.edu/Weather_Services/Chill_Calculators" target="_blank" rel="noopener"><span>UC chill calculators</span><span>↗</span></a>
    </div></section>`;
  } else renderSettings(m);
}
function renderSettings(m) {
  const s = settings(), who = store.get("dbx:who", null), r = ROOT(), mem = members(), me = ME();
  m.innerHTML = `
  <section class="card"><h2>Dropbox</h2>
    <dl class="kv"><dt>Account</dt><dd>${esc((who && (who.name || who.email)) || "Connected")}</dd><dt>Folder</dt><dd>${esc(r.display)}</dd>
      <dt>Status</dt><dd>${SYNC.busy ? "Syncing…" : SYNC.err ? `<span style="color:var(--bad)">${SYNC.err === "auth" ? "Sign-in expired" : SYNC.err === "offline" ? "Offline" : esc(SYNC.err)}</span>` : "Synced " + ago(SYNC.last)}${QUEUE.size ? ` · ${QUEUE.size} change${QUEUE.size > 1 ? "s" : ""} waiting` : ""}</dd>
      <dt>On this device</dt><dd>${FILES.size} records</dd></dl>
    <div class="row" style="margin-top:8px">${SYNC.err === "auth" ? `<button class="btn primary" id="recon">Reconnect Dropbox</button>` : `<button class="btn primary" id="syncnow">Sync now</button>`}<button class="btn" id="disc">Disconnect</button></div>
    <p class="note">Dropbox keeps every version of every file (30 days on free plans), and each person's changes are also logged in the folder's <code>history/</code>. Disconnecting removes this device's copy; your Dropbox folder is untouched.</p>
  </section>
  <section class="card"><h2>Who's using this device</h2>
    <select id="me" class="search">${mem.map(x => `<option value="${esc(x.id)}" ${x.id === me ? "selected" : ""}>${esc(x.name)}</option>`).join("")}${mem.some(x => x.id === me) ? "" : `<option selected value="${esc(me)}">${esc(me)}</option>`}</select>
    <p class="note">Edits and ticks from this device are signed with this name. Device: ${esc(deviceId())}.</p>
  </section>
  <section class="card"><h2>Wunderground</h2>
    <form id="sf" class="stack">
      <label class="small">API key (this device only)<input id="key" class="search" type="password" autocomplete="off" value="${esc(s.key)}" placeholder="Paste your key"></label>
      <div class="row"><label class="small" style="flex:1;min-width:140px">Main station<input id="pri" class="search" value="${esc(s.primary)}" placeholder="Station ID" autocapitalize="characters"></label><label class="small" style="flex:1;min-width:140px">Fallback<input id="fb" class="search" value="${esc(s.fallback)}" placeholder="Optional" autocapitalize="characters"></label></div>
      <div class="row"><button class="btn primary" type="submit">Save</button><span id="saved" class="small muted" aria-live="polite"></span></div>
    </form>
    <p class="note">Stations default to the ones in the orchard folder (site/climate.json). The key is never written to Dropbox. Find it at wunderground.com → My Profile → API Keys.</p>
  </section>
  <section class="card"><h2>This device</h2>
    <div class="row"><button class="btn" id="aerre">Download aerial photo again</button><button class="btn" id="clr">Clear saved weather</button></div>
    <p id="dmsg" class="small muted" aria-live="polite"></p>
  </section>
  <section class="card"><h2>About</h2><p class="small" style="margin:0">Orchard Management app, build ${esc(BUILD)}. Folder format ${esc(M.orchard.format)} ${esc(M.orchard.formatVersion || "")}; see README.md in the folder. Works offline once opened from the Home Screen.</p></section>`;
  const sn = $("#syncnow"); if (sn) sn.onclick = async () => { sn.disabled = true; sn.textContent = "Syncing…"; await sync(true) };
  const rc = $("#recon"); if (rc) rc.onclick = async () => { store.del("dbx:tok"); route() };
  $("#disc").onclick = () => { if (confirmBtn($("#disc"), "Tap again to disconnect")) disconnect() };
  $("#me").onchange = e => { store.set("me", e.target.value); $("#dmsg").textContent = "" };
  $("#sf").onsubmit = e => { e.preventDefault(); store.set("wx:key", $("#key").value.trim()); const d = settings(); const pri = $("#pri").value.trim().toUpperCase(), fb = $("#fb").value.trim().toUpperCase(); store.set("wx:stations", { primary: pri, fallback: fb }); $("#saved").textContent = "Saved on this device." };
  $("#aerre").onclick = async () => { const b = $("#aerre"); b.disabled = true; b.textContent = "Downloading…"; try { await getAerial(true); b.textContent = "Photo updated" } catch (e) { b.disabled = false; b.textContent = "Download aerial photo again"; $("#dmsg").textContent = e.message } };
  $("#clr").onclick = () => { ["wx:last", "wx:fc", "wx:geo"].forEach(k => store.del(k)); try { Object.keys(localStorage).filter(k => k.startsWith("om:chill:")).forEach(k => localStorage.removeItem(k)) } catch (e) { } $("#clr").textContent = "Cleared" };
}
function confirmBtn(b, txt) { if (b.dataset.armed) return true; b.dataset.armed = 1; const o = b.textContent; b.textContent = txt; setTimeout(() => { delete b.dataset.armed; b.textContent = o }, 4000); return false }

/* ---------- boot ---------- */
(async function boot() {
  try {
    for (const f of await idbAll("files")) FILES.set(f.rel, f);
    for (const q of await idbAll("queue")) QUEUE.set(q.rel, q);
  } catch (e) { console.warn("local copy unavailable", e) }
  const u = new URL(location.href), code = u.searchParams.get("code");
  if (code) {
    history.replaceState(null, "", location.pathname + "#today");
    try { await finishConnect(code) } catch (e) { connectMsg = e.message }
  } else if (u.searchParams.get("error")) { history.replaceState(null, "", location.pathname); connectMsg = "Dropbox connection was cancelled." }
  buildModel(); route();
  sync();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => { });
})();

</script>
